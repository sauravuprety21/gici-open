  - streamer:
      tag: str_gnss_eph_rov
      output_tags: [fmt_gnss_eph_rov]
      type: file
      path: /ssd/bag_files/multi_sensor_june_26/downtown/hw_sync/rosbag2_2024_06_26-12_06_57/gnssraw.ubx
