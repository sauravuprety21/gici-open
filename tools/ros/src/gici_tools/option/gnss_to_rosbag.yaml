rosbags:
- rosbag: 
    tag: rosbag_gnss_rov
    type: rosbag
    input_tags: [fmt_gnss_rov]
    path: /ssd/bag_files/multi_sensor_june_26/downtown/hw_sync/rosbag2_2024_06_26-12_06_57/gnss_rover.bag
    topic_name: /gici/gnss_rover
    format: gnss_raw
    enable_observation: true
- rosbag: 
    tag: rosbag_gnss_eph_rov
    type: rosbag
    input_tags: [fmt_gnss_eph_rov]
    path: /ssd/bag_files/multi_sensor_june_26/downtown/hw_sync/rosbag2_2024_06_26-12_06_57/rover_eph.bag
    topic_name: /gici/rover_ephemeris
    format: gnss_raw
    enable_ephemeris: true
    enable_ionosphere_parameter: true
- rosbag: 
    tag: rosbag_gnss_ref
    type: rosbag
    input_tags: [fmt_gnss_ref]
    path: /ssd/bag_files/multi_sensor_june_26/gnss_base_station/gnss_reference.bag
    topic_name: /gici/gnss_reference
    format: gnss_raw
    enable_observation: true
    enable_antenna_position: true
