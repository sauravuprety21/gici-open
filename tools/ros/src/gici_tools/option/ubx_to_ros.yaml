stream:
  streamers:
  - streamer:
      tag: str_gnss_rov
      output_tags: [fmt_gnss_rov]
      type: file
      path: /ssd/bag_files/multi_sensor_june_26/ccit_to_staples/university_tree_cover/rover/gnssraw.ubx

  - streamer:
      tag: str_gnss_eph_rov
      output_tags: [fmt_gnss_eph_rov]
      type: file
      path: /ssd/bag_files/multi_sensor_june_26/ccit_to_staples/university_tree_cover/rover/gnssraw.ubx
  formators:
  - formator:
      io: input
      tag: fmt_gnss_rov
      type: gnss-raw
      sub_type: ublox
      start_time: 2024.06.26
  - formator:
      io: input
      tag: fmt_gnss_eph_rov
      type: gnss-raw
      sub_type: ublox
      start_time: 2024.06.26

rosbags:
- rosbag: 
    tag: rosbag_gnss_rov
    type: rosbag
    input_tags: [fmt_gnss_rov]
    path: /ssd/bag_files/multi_sensor_june_26/ccit_to_staples/university_tree_cover/rover/gnss_rover.bag
    topic_name: /gici/gnss_rover
    format: gnss_raw
    enable_observation: true
- rosbag: 
    tag: rosbag_gnss_eph_rov
    type: rosbag
    input_tags: [fmt_gnss_eph_rov]
    path: /ssd/bag_files/multi_sensor_june_26/ccit_to_staples/university_tree_cover/rover/rover_eph.bag
    topic_name: /gici/rover_ephemeris
    format: gnss_raw
    enable_ephemeris: true
    enable_ionosphere_parameter: true